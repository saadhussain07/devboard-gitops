apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: devboard-backend
  namespace: devboard
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: devboard-backend
  template:
    metadata:
      labels:
        app: devboard-backend
    spec:
      # Non-root, read-only rootfs, dropped capabilities — same posture
      # enforced at the pod level as at the cluster/node level.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # DHI/distroless images use numeric nonroot UID 65532 - k8s can't verify a named user like 'nonroot'
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devboard-backend
          image: saadhussain07/devboard-backend:59a6e8d1cf6f85f692b097b2736410ab78327b2a # bumped in CI via yq once pipeline runs, see workflow-replacements/deploy.yml
          ports:
            - containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: devboard-configmap
            - secretRef:
                name: devboard-secrets # synced by External Secrets Operator, same name the original k8s/secrets.yml used
          env:
            # Backend expects a single POSTGRES_URL DSN (see backend/main.go
            # line 47), not separate POSTGRES_USER/PASSWORD/DB vars - those
            # come in via envFrom above, composed into the DSN here using
            # k8s $(VAR) substitution. Without this, it silently falls back
            # to its hardcoded localhost default and never connects.
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
  strategy:
    canary:
      canaryService: devboard-backend-canary
      stableService: devboard-backend-stable
      steps:
        - setWeight: 20
        - pause: {duration: 60s}
        - analysis:
            templates:
              - templateName: success-rate-and-latency
        - setWeight: 50
        - pause: {duration: 60s}
        - analysis:
            templates:
              - templateName: success-rate-and-latency
        - setWeight: 100
      trafficRouting:
        nginx:
          stableIngress: devboard-backend-ingress
