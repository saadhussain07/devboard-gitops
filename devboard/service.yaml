apiVersion: v1
kind: Service
metadata:
  name: devboard-backend-stable
  namespace: devboard
spec:
  selector:
    app: devboard-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: devboard-backend-canary
  namespace: devboard
spec:
  selector:
    app: devboard-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devboard-backend-ingress
  namespace: devboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # NOTE: no nginx.ingress.kubernetes.io/canary annotation here on purpose.
    # This is the STABLE ingress referenced by rollout.yaml's
    # trafficRouting.nginx.stableIngress - Argo Rollouts itself creates a
    # separate, ephemeral canary Ingress automatically during each rollout
    # step. Manually marking this one as canary routes 0% traffic to it
    # (nginx canary default weight), which is what caused both the 404s
    # and the earlier ACME HTTP01 challenge failures.
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["api.devboard.15-252-151-45.sslip.io"]
      secretName: devboard-api-tls
  rules:
    - host: "api.devboard.15-252-151-45.sslip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devboard-backend-stable
                port:
                  number: 8080