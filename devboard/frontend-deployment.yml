apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-frontend-deployment
  namespace: devboard
  labels:
    app: devboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-frontend
  template:
    metadata:
      labels:
        app: devboard-frontend
    spec:
      # Required by our own Kyverno disallow-privileged-and-root policy.
      # Same pattern as the backend Rollout: DHI/distroless images use a
      # numeric nonroot UID (65532) that k8s can't verify from a named
      # user, so it must be set explicitly.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devboard-frontend
          image: saadhussain07/devboard-frontend:28f147152eb6e0e846ca3fc4afaf59bb05863b27
          ports:
            - containerPort: 4173
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: # min needed
              cpu: 10m
              memory: 64Mi
            limits: # max usable
              cpu: 250m
              memory: 128Mi
