apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-frontend-deployment
  namespace: devboard
  labels:
    app: devboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-frontend
  template:
    metadata:
      labels:
        app: devboard-frontend
    spec:
      containers:
        - name: devboard-frontend
          image: saadhussain07/devboard-frontend:59a6e8d1cf6f85f692b097b2736410ab78327b2a
          ports:
            - containerPort: 4173
          resources:
            requests: # min needed
              cpu: 10m
              memory: 64Mi
            limits: # max usable
              cpu: 250m
              memory: 128Mi
