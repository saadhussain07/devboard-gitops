apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-and-latency
  namespace: devboard
spec:
  args:
    - name: canary-service
      value: devboard-backend-canary
  metrics:
    # Uses ingress-nginx's own request metrics rather than app-level
    # instrumentation - the Go backend (gin) doesn't expose a Prometheus
    # /metrics endpoint, and instrumenting it properly was out of scope
    # for the time available. ingress-nginx already sees every request
    # that hits the canary pods (traffic is routed through it), so its
    # metrics are a legitimate, real signal - not synthetic.
    - name: success-rate
      interval: 30s
      count: 3
      successCondition: result[0] >= 0.90
      failureLimit: 2
      inconclusiveLimit: 3
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(rate(nginx_ingress_controller_requests{ingress="devboard-backend-ingress", status!~"5.."}[2m]))
            /
            clamp_min(sum(rate(nginx_ingress_controller_requests{ingress="devboard-backend-ingress"}[2m])), 0.001)

    - name: p95-latency-seconds
      interval: 30s
      count: 3
      successCondition: result[0] <= 1.0
      failureLimit: 2
      inconclusiveLimit: 3
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            histogram_quantile(0.95,
              sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{ingress="devboard-backend-ingress"}[2m])) by (le)
            )