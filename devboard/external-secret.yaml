# Replaces k8s/secrets.yml. That file had a hardcoded base64 password
# ("devboard") committed to git — delete it once this is applied.
#
# This ClusterSecretStore + ExternalSecret pulls the real password from
# AWS Secrets Manager and materializes it as a normal k8s Secret named
# `devboard-secrets` (same name your Deployments already reference — no
# other manifest needs to change).

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1 # match terraform var.aws_region
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devboard-db-credentials
  namespace: devboard
spec:
  refreshInterval: 15m # picks up rotated passwords without a manual redeploy
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: devboard-secrets # same name the existing Deployments already use
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: devboard-eks/devboard-db # matches terraform output db_secret_name
